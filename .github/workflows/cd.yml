name: CI/CD

on:
  workflow_dispatch:
    inputs:
      is_rollback:
        description: "Is this a Rollback? (If checked, skips Build/Push and only deploys the release_tag)"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Optional Docker image tag (e.g. v1.2.3). MUST be provided if is_rollback is true."
        required: false
        default: ""

env:
  NODE_VERSION_FILE_BE: backend/.nvmrc
  NODE_VERSION_FILE_FE: frontend/.nvmrc
  TAG: ${{ github.event.inputs.release_tag || format('build-{0}', github.run_number) }}

jobs:
  ci:
    name: CI
    if: github.event.inputs.is_rollback == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE_BE }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend lint
        working-directory: backend
        run: npm run lint || echo "no lint script"
      - name: Backend test
        working-directory: backend
        run: npm test

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE_FE }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint || echo "no lint script"
      - name: Frontend test
        working-directory: frontend
        run: npm test || echo "no tests"
      - name: Frontend build
        working-directory: frontend
        run: npm run build || echo "no build script"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('predictor/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install predictor dependencies
        working-directory: predictor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Predictor tests
        working-directory: predictor
        run: pytest tests -q
        env:
          PYTHONPATH: ..

  publish:
    name: Build and push Docker images
    needs: ci
    if: github.event.inputs.is_rollback == 'false'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/backend-real-estate:${{ env.TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/frontend-real-estate:${{ env.TAG }}

      - name: Build and push predictor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./predictor/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/predictor-real-estate:${{ env.TAG }}

  deploy:
    name: Deploy to AWS EKS
    needs: publish
    if: |
      always() && 
      ( (github.event.inputs.is_rollback == 'true') || 
        (github.event.inputs.is_rollback == 'false' && needs.publish.result == 'success') )
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Rollback Tag
        if: github.event.inputs.is_rollback == 'true' && github.event.inputs.release_tag == ''
        run: |
          echo "ERROR: You must provide a 'release_tag' when is_rollback is true!"
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
              --name "${{ env.EKS_CLUSTER_NAME }}" \
              --region "${{ env.AWS_REGION }}"

      - name: Update Kubernetes image tags
        run: |
          echo "Updating all kubernetes yaml files to use tag: ${TAG}"
          sed -i "s|image: .*/backend-real-estate:.*|image: ${{ env.DOCKERHUB_USERNAME }}/backend-real-estate:${{ env.TAG }}|g" infra/kube/*.yaml
          sed -i "s|image: .*/frontend-real-estate:.*|image: ${{ env.DOCKERHUB_USERNAME }}/frontend-real-estate:${{ env.TAG }}|g" infra/kube/*.yaml
          sed -i "s|image: .*/predictor-real-estate:.*|image: ${{ env.DOCKERHUB_USERNAME }}/predictor-real-estate:${{ env.TAG }}|g" infra/kube/*.yaml

      - name: Deploy manifests to EKS
        run: kubectl apply -f infra/kube -n real-estate-prod
