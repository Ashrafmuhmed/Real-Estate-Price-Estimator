name: CI/CD

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Optional Docker image tag to use (e.g. v1.2.3). If empty, workflow will use build-<run_number>"
                required: false
                default: ""

env:
    NODE_VERSION_FILE_BE: be/.nvmrc
    NODE_VERSION_FILE_FE: Website/.nvmrc

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js for backend
              uses: actions/setup-node@v4
              with:
                  node-version-file: ${{ env.NODE_VERSION_FILE_BE }}
                  cache: npm
                  cache-dependency-path: be/package-lock.json
            - name: Install backend dependencies
              working-directory: be
              run: npm ci
            - name: Backend lint
              working-directory: be
              run: npm run lint || echo "no lint script"
            - name: Backend test
              working-directory: be
              run: npm test

            - name: Setup Node.js for frontend
              uses: actions/setup-node@v4
              with:
                  node-version-file: ${{ env.NODE_VERSION_FILE_FE }}
                  cache: npm
                  cache-dependency-path: Website/package-lock.json
            - name: Install frontend dependencies
              working-directory: Website
              run: npm ci
            - name: Frontend lint
              working-directory: Website
              run: npm run lint || echo "no lint script"
            - name: Frontend test
              working-directory: Website
              run: npm test || echo "no tests"
            - name: Frontend build
              working-directory: Website
              run: npm run build || echo "no build script"

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('predictor_service/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install predictor dependencies
              working-directory: predictor_service
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Predictor tests
              working-directory: predictor_service
              run: pytest tests -q
              env:
                  PYTHONPATH: ..

    publish:
        name: Build and push Docker images
        needs: ci
        runs-on: ubuntu-latest
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            TAG: ${{ github.event.inputs.release_tag || format('build-{0}', github.run_number) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./be
                  file: ./be/Dockerfile
                  push: true
                  tags: ${{ env.DOCKERHUB_USERNAME }}/backend-real-estate:${{ env.TAG }}

            - name: Build and push frontend image
              uses: docker/build-push-action@v5
              with:
                  context: ./Website
                  file: ./Website/Dockerfile
                  push: true
                  tags: ${{ env.DOCKERHUB_USERNAME }}/frontend-real-estate:${{ env.TAG }}

            - name: Build and push predictor image
              uses: docker/build-push-action@v5
              with:
                  context: ./predictor_service
                  file: ./predictor_service/Dockerfile
                  push: true
                  tags: ${{ env.DOCKERHUB_USERNAME }}/predictor-real-estate:${{ env.TAG }}

            - name: Save image tags
              run: |
                  echo "BACKEND_IMAGE=${{ env.DOCKERHUB_USERNAME }}/backend-real-estate:${{ env.TAG }}" >> $GITHUB_ENV
                  echo "FRONTEND_IMAGE=${{ env.DOCKERHUB_USERNAME }}/frontend-real-estate:${{ env.TAG }}" >> $GITHUB_ENV
                  echo "PREDICTOR_IMAGE=${{ env.DOCKERHUB_USERNAME }}/predictor-real-estate:${{ env.TAG }}" >> $GITHUB_ENV

    deploy:
        name: Deploy to AWS EKS
        needs: publish
        runs-on: ubuntu-latest
        env:
            AWS_REGION: ${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Update kubeconfig for EKS
              uses: aws-actions/amazon-eks-update-kubeconfig@v2
              with:
                  cluster-name: ${{ env.EKS_CLUSTER_NAME }}
                  region: ${{ env.AWS_REGION }}

            - name: Update Kubernetes image tags
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  images = {
                      'abdulrhmanmokhtar/backend-real-estate:v1': '${{ env.DOCKERHUB_USERNAME }}/backend-real-estate:${{ env.TAG }}',
                      'abdulrhmanmokhtar/frontend-real-estate:v1': '${{ env.DOCKERHUB_USERNAME }}/frontend-real-estate:${{ env.TAG }}',
                      'abdulrhmanmokhtar/predictor-real-estate:v1': '${{ env.DOCKERHUB_USERNAME }}/predictor-real-estate:${{ env.TAG }}',
                  }
                  for path in ['kube/backend.yaml', 'kube/frontend.yaml', 'kube/predictor.yaml']:
                      text = Path(path).read_text()
                      for old, new in images.items():
                          text = text.replace(old, new)
                      Path(path).write_text(text)
                  PY

            - name: Deploy manifests to EKS
              run: kubectl apply -f kube -n real-estate-prod