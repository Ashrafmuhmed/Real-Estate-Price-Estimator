name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Backend - Node.js
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: "backend/.nvmrc"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json
            - name: Install dependencies
              working-directory: backend
              run: npm ci
            - name: Lint
              working-directory: backend
              run: npm run lint || echo "no lint script"
            - name: Test
              working-directory: backend
              run: npm test

    frontend:
        name: Frontend - Node.js
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: "frontend/.nvmrc"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            - name: Lint
              working-directory: frontend
              run: npm run lint || echo "no lint script"
            - name: Test
              working-directory: frontend
              run: npm test || echo "no tests"
            - name: Build
              working-directory: frontend
              run: npm run build || echo "no build script"

    predictor:
        name: Predictor - Python
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
                  cache: "pip"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('predictor/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              working-directory: predictor
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Run tests
              working-directory: predictor
              run: pytest tests -q
              env:
                  PYTHONPATH: ..