name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Backend (be) - Node.js
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: "be/.nvmrc"
                  cache: "npm"
            - name: Install dependencies
              working-directory: be
              run: npm ci
            - name: Lint
              working-directory: be
              run: npm run lint || echo "no lint script"
            - name: Test
              working-directory: be
              run: npm test

    frontend:
        name: Frontend (Website) - Node.js
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: "Website/.nvmrc"
                  cache: "npm"
            - name: Install dependencies
              working-directory: Website
              run: npm ci
            - name: Lint
              working-directory: Website
              run: npm run lint || echo "no lint script"
            - name: Test
              working-directory: Website
              run: npm test || echo "no tests"
            - name: Build
              working-directory: Website
              run: npm run build || echo "no build script"

    predictor:
        name: Predictor (predictor_service) - Python
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              working-directory: predictor_service
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest; fi
            - name: Run tests
              working-directory: predictor_service
              run: pytest -q
